name: CI & Release

on:
  pull_request:
    branches: [release]
  push:
    branches: [release]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: Analyze & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Example-app lint infos are non-fatal; warnings and errors still fail.
      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test

      # pub publish --dry-run fails on the uncommitted-change warning this causes.
      - name: Restore lockfile drift from pub get
        run: git checkout -- .

      - name: Publish dry run
        run: flutter pub publish --dry-run

  release:
    name: Tag & Release
    needs: validate
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write # push tag, create GitHub release
      actions: write # dispatch publish.yml
    steps:
      - name: Guard branch
        run: |
          if [ "$GITHUB_REF" != "refs/heads/release" ]; then
            echo "::error::Releases can only run from the release branch (got $GITHUB_REF)"
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read pubspec version
        id: version
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}')
          if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.]+)?(\+[A-Za-z0-9.]+)?$'; then
            echo "::error::Version '$VERSION' in pubspec.yaml is not valid semver"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Releasing version: $VERSION"

      - name: Check if version is already published
        id: check
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          HTTP=$(curl -s -o "$RUNNER_TEMP/pub-api.json" -w '%{http_code}' https://pub.dev/api/packages/blaze_sdk_flutter)
          if [ "$HTTP" = "200" ] && jq -e --arg v "$VERSION" '.versions[] | select(.version == $v)' "$RUNNER_TEMP/pub-api.json" > /dev/null; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "::notice::blaze_sdk_flutter $VERSION already exists on pub.dev. Bump the version in pubspec.yaml to publish a new release."
          elif [ "$HTTP" = "200" ] || [ "$HTTP" = "404" ]; then
            echo "published=false" >> "$GITHUB_OUTPUT"
          else
            echo "::error::pub.dev API returned HTTP $HTTP"
            exit 1
          fi

      - name: Create & push tag
        if: steps.check.outputs.published == 'false'
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          if git rev-parse -q --verify "refs/tags/$VERSION" >/dev/null; then
            if [ "$(git rev-parse "$VERSION^{commit}")" != "$(git rev-parse HEAD)" ]; then
              echo "::error::Tag $VERSION already exists on a different commit; bump the version in pubspec.yaml"
              exit 1
            fi
            echo "Tag $VERSION already points at this commit, reusing it."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$VERSION" -m "Release $VERSION"
            git push origin "refs/tags/$VERSION"
          fi

      - name: Create GitHub release
        if: steps.check.outputs.published == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "GitHub release $VERSION already exists, skipping."
          else
            gh release create "$VERSION" --title "$VERSION" --generate-notes
          fi

      - name: Dispatch publish workflow on the tag
        if: steps.check.outputs.published == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Tags pushed with GITHUB_TOKEN don't trigger workflows on their own.
          gh workflow run publish.yml --ref "${{ steps.version.outputs.version }}"
